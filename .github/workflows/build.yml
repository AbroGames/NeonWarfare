# Builds every project, runs the unit tests, then the game tests inside Godot.
# The unit tests never start the engine: Godot.NET.Sdk and GodotSharp come from NuGet — see
# Docs/Testing.md. The game tests do, so Godot is downloaded for them, the same version the game builds
# with — see Docs/Game-testing.md.
# Each test step names its project explicitly, so the smoke tests are compiled but not run — see
# Docs/Smoke-testing.md.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test Tests/NeonWarfare.Tests/NeonWarfare.Tests.csproj --no-build --verbosity normal

    # Read from the game project rather than written here, so a Godot upgrade is one edit.
    - name: Read Godot version
      run: |
        version=$(sed -n 's/.*Sdk="Godot\.NET\.Sdk\/\([^"]*\)".*/\1/p' NeonWarfare.csproj)
        if [ -z "$version" ]; then
          echo "Could not read the Godot.NET.Sdk version from NeonWarfare.csproj" >&2
          exit 1
        fi
        echo "GODOT_VERSION=$version" >> "$GITHUB_ENV"
    - name: Cache Godot
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
    - name: Download Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
    # The gdUnit4 adapter finds Godot through GODOT_BIN only.
    - name: Locate Godot
      run: |
        godot_bin="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
        "$godot_bin" --headless --version
        echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
    - name: Game tests
      run: dotnet test Tests/NeonWarfare.GameTests/NeonWarfare.GameTests.csproj --no-build --verbosity normal
