# Builds every project and runs the unit tests.
# Godot is not installed here on purpose: Godot.NET.Sdk and GodotSharp come from NuGet, and the unit
# tests never start the engine — see Docs/Testing.md.
# The Test step names the unit test project explicitly, so the smoke tests are compiled but not run:
# they do launch the engine, which this runner does not have — see Docs/Smoke-testing.md.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test Tests/NeonWarfare.Tests/NeonWarfare.Tests.csproj --no-build --verbosity normal
